<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Campaign Poster AR</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
  <div id="overlay">
    <div id="statusPanel">
      <div id="statusLine">Tap "FIX IT SCAN" to scan the poster.</div>
    </div>
    <div id="landingText" hidden>
      <div class="line1">GATVOL?</div>
      <div class="line2" id="landingLine2"></div>
    </div>

    <button id="startButton" type="button" disabled>FIX IT SCAN</button>
  </div>
  <div id="container"></div>
  <div id="scanPrompt" hidden>📷 Point your camera at the poster</div>
  <button id="soundToggle" type="button" hidden>🔇 Tap for sound</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
